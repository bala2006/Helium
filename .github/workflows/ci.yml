name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # API 37 ships as minor-versioned platforms, so the package is
      # platforms;android-37.2 — there is no bare `platforms;android-37`.
      # This must match compileSdk/compileSdkMinor in gradle/libs.versions.toml.
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show toolchain
        run: ./gradlew --version

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helium-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  backend:
    name: Gateway build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The gateway is a plain JVM service: it deliberately does not need the
      # Android SDK, so this job stays fast and independent of the app's build.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show toolchain
        run: ./gradlew --version

      - name: Build and test
        run: ./gradlew test --stacktrace

      - name: Verify the runnable distribution
        run: ./gradlew installDist --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "backend/build/reports/tests/**"
          if-no-files-found: ignore
